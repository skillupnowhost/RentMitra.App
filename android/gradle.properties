# Tuned conservatively for this machine's ~7.5GB total RAM — the daemon has
# crashed repeatedly with a native OOM (Chunk::new malloc failure) because
# the system runs out of free physical memory under load, not because the
# JVM heap itself was exhausted. SerialGC trades throughput for a much
# smaller JVM memory footprint than the default G1GC, which matters more
# here than build speed.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Avoids a Windows-specific "Could not close incremental caches" failure in
# compileDebugKotlin (file-lock race on the Kotlin build-cache .tab files).
kotlin.incremental=false
